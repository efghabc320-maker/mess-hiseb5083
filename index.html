<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a4a42">
<title>মেস হিসাব</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. A deep green hero card carries the meal rate; everything else stays quiet. */
:root{
  --font:'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;
  --font-d:'Anek Bangla','Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;
  --bg:#eef4f2; --surface:#ffffff; --fg:#10201e; --muted:#53706a; --line:#d6e2df;
  --accent:#0b7a6b; --accent-fg:#ffffff; --accent-soft:#dcf1ec;
  --good:#13723a; --good-soft:#d9f2e2; --owe:#a8321d; --owe-soft:#fae3dd;
  --warn:#6f5200; --warn-soft:#fff0c7;
  --hero-bg:#0a4a42; --hero-fg:#effaf7; --hero-muted:#a7d3c9; --hero-hi:#8cf0da;
  --a1:#0b7a6b; --a1s:#d6f0ea; --a2:#a8530a; --a2s:#fde8cc; --a3:#2563a8; --a3s:#dbe9f9;
  --a4:#a8326b; --a4s:#fadbe9; --a5:#566f0e; --a5s:#e6f0c9; --a6:#7a4fb3; --a6s:#eadff7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1413; --surface:#15221f; --fg:#e6f1ee; --muted:#93aca6; --line:#26383a;
    --accent:#3fc7b0; --accent-fg:#06201b; --accent-soft:#143530;
    --good:#6fd68f; --good-soft:#143323; --owe:#ff9a85; --owe-soft:#3a1d17;
    --warn:#f2cc6b; --warn-soft:#3a2f10;
    --hero-bg:#0f3f39; --hero-fg:#effaf7; --hero-muted:#9ccbc1; --hero-hi:#8cf0da;
    --a1:#5fd9c2; --a1s:#123a34; --a2:#f4b25c; --a2s:#3d2a10; --a3:#7db4f0; --a3s:#14304d;
    --a4:#f08cb8; --a4s:#451a30; --a5:#b5d45b; --a5s:#2f3a10; --a6:#c1a2ec; --a6s:#2f2145;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1413; --surface:#15221f; --fg:#e6f1ee; --muted:#93aca6; --line:#26383a;
  --accent:#3fc7b0; --accent-fg:#06201b; --accent-soft:#143530;
  --good:#6fd68f; --good-soft:#143323; --owe:#ff9a85; --owe-soft:#3a1d17;
  --warn:#f2cc6b; --warn-soft:#3a2f10;
  --hero-bg:#0f3f39; --hero-fg:#effaf7; --hero-muted:#9ccbc1; --hero-hi:#8cf0da;
  --a1:#5fd9c2; --a1s:#123a34; --a2:#f4b25c; --a2s:#3d2a10; --a3:#7db4f0; --a3s:#14304d;
  --a4:#f08cb8; --a4s:#451a30; --a5:#b5d45b; --a5s:#2f3a10; --a6:#c1a2ec; --a6s:#2f2145;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font); font-size:16px; line-height:1.55;
  padding-block:18px 108px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
p{margin:0}
h1{margin:0; font-family:var(--font-d); font-size:1.5rem; line-height:1.25; font-weight:700}
h2{margin:0; font-family:var(--font-d); font-size:1.0625rem; font-weight:600; text-wrap:balance}
.app{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
#main{display:flex; flex-direction:column; gap:14px}

.top{display:flex; justify-content:space-between; align-items:center; gap:12px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.logo{width:38px; height:38px; flex:none; border-radius:11px; background:var(--accent); color:var(--accent-fg); display:grid; place-items:center; font-family:var(--font-d); font-weight:700; font-size:1.25rem}
.month{background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:.875rem; padding:3px 12px; border-radius:999px; white-space:nowrap}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; min-width:0; box-shadow:0 1px 2px rgba(16,32,30,.05)}
.card.form{display:flex; flex-direction:column; gap:12px}
.empty{display:flex; flex-direction:column; align-items:flex-start; gap:8px}
.empty p{color:var(--muted)}
.eic{width:44px; height:44px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center}
.banner{background:var(--warn-soft); color:var(--warn); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.banner .btn{align-self:flex-start; background:transparent; color:var(--warn); border-color:currentColor}

.hero{
  background:radial-gradient(circle at 100% 0, rgba(255,255,255,.09) 0 92px, transparent 93px), radial-gradient(circle at 0 100%, rgba(255,255,255,.06) 0 70px, transparent 71px), var(--hero-bg);
  color:var(--hero-fg); border-radius:18px; padding:20px 18px 16px; display:flex; flex-direction:column; gap:2px;
}
.hl{color:var(--hero-muted); font-size:.9375rem}
.hbig{font-family:var(--font-d); font-size:3.25rem; line-height:1.15; font-weight:700; color:var(--hero-hi); font-variant-numeric:tabular-nums}
.hs{color:var(--hero-muted); font-size:.875rem}
.hstats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.16)}
.hstats span{display:block; color:var(--hero-muted); font-size:.8125rem; line-height:1.35}
.hstats b{display:block; font-family:var(--font-d); font-weight:600; font-size:1.0625rem; font-variant-numeric:tabular-nums}

dl{margin:0}
.bd>div{display:flex; justify-content:space-between; gap:12px; padding:8px 0}
.bd>div+div{border-top:1px solid var(--line)}
dt{color:var(--muted); min-width:0}
dd{margin:0; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.bd .sum dt{color:var(--fg); font-weight:600}
.sec{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:4px}

.av{width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center; font-family:var(--font-d); font-weight:700; font-size:1.0625rem}
details.mem{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:2px 14px; box-shadow:0 1px 2px rgba(16,32,30,.05)}
details.mem summary{list-style:none; display:flex; align-items:center; gap:12px; min-height:62px; cursor:pointer}
details.mem summary::-webkit-details-marker{display:none}
details.mem summary::after{content:""; width:8px; height:8px; flex:none; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); margin-bottom:3px}
details.mem[open] summary::after{transform:rotate(-135deg); margin-bottom:-3px}
details.mem .bd{padding-bottom:8px}
.mi{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px}
.nm{font-weight:600; overflow-wrap:anywhere; min-width:0}
.bar{display:block; position:relative; height:6px; border-radius:3px; background:var(--line)}
.bar::after{content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:2px; margin-left:-1px; background:var(--muted); opacity:.5; border-radius:1px}
.bar i{position:absolute; top:0; bottom:0; border-radius:3px}
.bar i.p{left:50%; background:var(--good)}
.bar i.n{right:50%; background:var(--owe)}
.pill{padding:2px 12px; border-radius:999px; font-weight:600; font-size:.9375rem; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.owe{background:var(--owe-soft); color:var(--owe)}
.pill.even{background:var(--accent-soft); color:var(--accent)}
.note{color:var(--muted); font-size:.875rem}

.btn{min-height:46px; padding:0 16px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--fg); font:inherit; font-weight:600; cursor:pointer}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}
.btn.danger{color:var(--owe)}
.btn.sq{width:46px; padding:0; font-size:1.25rem; line-height:1; flex:none}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn:focus-visible, .tab:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input, select, textarea{width:100%; min-height:46px; padding:0 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--fg); font:inherit; min-width:0}
textarea{padding:10px 12px; resize:vertical}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field label{font-size:.875rem; color:var(--muted)}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}

.list{display:flex; flex-direction:column}
.list>*{padding:10px 0}
.list>*+*{border-top:1px solid var(--line)}
.bz{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px; align-items:center}
.bz .t{font-weight:600; overflow-wrap:anywhere}
.bz .s{font-size:.875rem; color:var(--muted)}
.bz .amt{font-family:var(--font-d); font-weight:700; font-variant-numeric:tabular-nums}

.mrow{display:flex; flex-direction:column; gap:12px}
.mh{display:flex; align-items:center; gap:10px}
.stepper{display:grid; grid-template-columns:50px minmax(0,1fr) 50px; gap:8px}
.stepper .btn{min-height:50px}
.stepper input{min-height:50px; text-align:center; font-family:var(--font-d); font-size:1.375rem; font-weight:700; font-variant-numeric:tabular-nums}
.srow{display:grid; grid-template-columns:38px minmax(0,1fr) 46px; gap:8px; align-items:center; padding:5px 0}
.srow.fx{grid-template-columns:minmax(0,1fr) 104px 46px}
.srow.mr{grid-template-columns:38px minmax(0,1fr) 92px 46px}
.it{margin:0 0 2px; padding-left:18px; font-weight:500}
.bz{align-items:start}

.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  background:var(--surface); border-top:1px solid var(--line);
  padding-top:6px; padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left:max(8px, env(safe-area-inset-left, 0px));
  padding-right:max(8px, env(safe-area-inset-right, 0px));
}
.tabs .in{max-width:560px; margin:0 auto; display:flex; gap:4px}
.tab{flex:1; min-height:54px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:0; border-radius:12px; color:var(--muted); font:inherit; font-size:.8125rem; cursor:pointer}
.tab[aria-current="page"]{color:var(--accent); background:var(--accent-soft); font-weight:600}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:.9375rem; z-index:6; max-width:calc(100% - 32px); text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">৳</span><h1>মেস হিসাব</h1></div>
    <p class="month" id="month"></p>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="প্রধান মেনু">
  <div class="in">
    <button class="tab" data-act="tab" data-tab="summary"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6M3 20h18"/></svg>হিসাব</button>
    <button class="tab" data-act="tab" data-tab="bazar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11H6.2L5 8zM9 8V6a3 3 0 016 0v2"/></svg>বাজার</button>
    <button class="tab" data-act="tab" data-tab="meal"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 01-18 0zM8 7c0-1 1-1.5 1-3M14 7c0-1 1-1.5 1-3"/></svg>মিল</button>
    <button class="tab" data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>সেটিং</button>
  </div>
</nav>
<div id="toast" role="status" hidden></div>

<script>
(function(){
  var KEY = 'mess-hisab-v2';
  var DIG = '০১২৩৪৫৬৭৮৯';
  var $ = function(s){ return document.querySelector(s); };

  var nf0 = new Intl.NumberFormat('bn-BD', {maximumFractionDigits:2});
  var nf2 = new Intl.NumberFormat('bn-BD', {minimumFractionDigits:2, maximumFractionDigits:2});
  var nfm = new Intl.NumberFormat('bn-BD', {maximumFractionDigits:1});
  function tk(n){ return '৳' + nf0.format(Math.round(n*100)/100); }
  function tk2(n){ return '৳' + nf2.format(n); }
  function num(v){
    var s = String(v).replace(/[০-৯]/g, function(d){ return DIG.indexOf(d); }).replace(/,/g,'').replace('।','.').trim();
    var x = parseFloat(s);
    return isFinite(x) ? x : 0;
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function monthName(){ return new Date().toLocaleDateString('bn-BD', {month:'long', year:'numeric'}); }
  function fmtDate(s){
    var p = String(s).split('-').map(Number);
    return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('bn-BD', {day:'numeric', month:'long'});
  }

  function sample(){
    var d = new Date(), ym = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-';
    function day(n){ return ym+pad(n); }
    return {
      sample:true, month:monthName(), payer:'m1',
      advances:[{id:'a1', date:day(14), from:'m2', to:'m1', amount:2000},{id:'a2', date:day(14), from:'m3', to:'m1', amount:2000},{id:'a3', date:day(14), from:'m4', to:'m1', amount:2000}],
      members:[
        {id:'m1', name:'রাফি', meals:52, rent:2800},
        {id:'m2', name:'সাকিব', meals:48, rent:3200},
        {id:'m3', name:'তানভীর', meals:56, rent:4000},
        {id:'m4', name:'নাঈম', meals:44, rent:2000}
      ],
      fixed:[
        
        {id:'f2', name:'বিদ্যুৎ বিল', amount:1600},
        {id:'f3', name:'গ্যাস ও পানি', amount:800},
        {id:'f4', name:'ইন্টারনেট', amount:800},
        {id:'f5', name:'বুয়ার বেতন', amount:1200}
      ],
      bazar:[
        {id:'b1', date:day(2),  who:'m1', amount:1850, note:'চাল ২ কেজি\nডাল ১ কেজি\nসয়াবিন তেল ৫ লিটার'},
        {id:'b2', date:day(5),  who:'m2', amount:2200, note:'মাছ ও সবজি'},
        {id:'b3', date:day(8),  who:'m3', amount:1400, note:'মুরগি, ডিম'},
        {id:'b4', date:day(12), who:'m4', amount:1700, note:'সবজি ও মসলা'},
        {id:'b5', date:day(16), who:'m1', amount:2650, note:'রুই মাছ ২ কেজি\nগরুর মাংস ১ কেজি'},
        {id:'b6', date:day(20), who:'m3', amount:1900, note:'সবজি, ডিম'}
      ]
    };
  }
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY));
      if(s && Array.isArray(s.members) && Array.isArray(s.fixed) && Array.isArray(s.bazar)){ if(!Array.isArray(s.advances)) s.advances = []; return s; }
    }catch(e){}
    return null;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var state = load() || sample();
  var tab = 'summary', lastWho = '', confirmNew = false, copyBox = null, toastTimer = null;

  function toast(t){
    var el = $('#toast'); el.textContent = t; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, 2400);
  }
  function member(id){ return state.members.filter(function(m){ return m.id === id; })[0]; }
  function fixedItem(id){ return state.fixed.filter(function(f){ return f.id === id; })[0]; }

  function avatar(id){
    var idx = -1, i;
    for(i = 0; i < state.members.length; i++){ if(state.members[i].id === id){ idx = i; break; } }
    var m = idx >= 0 ? state.members[idx] : null;
    var k = (idx >= 0 ? idx : 0) % 6 + 1;
    var ch = m ? (Array.from(m.name)[0] || '?') : '?';
    return '<span class="av" style="background:var(--a' + k + 's);color:var(--a' + k + ')" aria-hidden="true">' + esc(ch) + '</span>';
  }

  function calc(){
    var ms = state.members, n = ms.length;
    var fixedTotal = state.fixed.reduce(function(a,f){ return a+f.amount; }, 0);
    var share = n ? fixedTotal/n : 0;
    var rentTotal = ms.reduce(function(a,m){ return a+(m.rent||0); }, 0), totalCost = fixedTotal + rentTotal;
    function adv(f){ return state.advances.filter(f).reduce(function(a,x){ return a+x.amount; }, 0); }
    var totalBazar = state.bazar.reduce(function(a,b){ return a+b.amount; }, 0);
    var totalMeals = ms.reduce(function(a,m){ return a+m.meals; }, 0);
    var rate = totalMeals > 0 ? totalBazar/totalMeals : 0;
    var rows = ms.map(function(m){
      var bz = state.bazar.filter(function(b){ return b.who === m.id; }).reduce(function(a,b){ return a+b.amount; }, 0);
      var mealCost = m.meals*rate, rent = m.rent||0, owed = rent+share+mealCost;
      var given = adv(function(a){ return a.from === m.id; }), got = adv(function(a){ return a.to === m.id; });
      var billPaid = state.payer === m.id ? totalCost : 0, paid = bz-got+given+billPaid;
      return {m:m, bz:bz, rent:rent, given:given, got:got, billPaid:billPaid, mealCost:mealCost, owed:owed, paid:paid, net:paid-owed};
    });
    var sumNet = rows.reduce(function(a,r){ return a+r.net; }, 0);
    var maxAbs = rows.reduce(function(a,r){ return Math.max(a, Math.abs(r.net)); }, 0);
    return {n:n, fixedTotal:fixedTotal, rentTotal:rentTotal, totalCost:totalCost, share:share, totalBazar:totalBazar, totalMeals:totalMeals, rate:rate, rows:rows, sumNet:sumNet, maxAbs:maxAbs};
  }
  function pillText(net){
    var r = Math.round(net*100);
    if(r > 0) return 'পাবে ' + tk(net);
    if(r < 0) return 'দিতে হবে ' + tk(-net);
    return 'হিসাব মিলেছে';
  }
  function pill(net){
    var r = Math.round(net*100), cls = r > 0 ? 'good' : (r < 0 ? 'owe' : 'even');
    return '<span class="pill ' + cls + '">' + pillText(net) + '</span>';
  }
  function bar(net, maxAbs){
    var w = maxAbs > 0 ? Math.min(50, Math.abs(net)/maxAbs*50) : 0;
    var cls = Math.round(net*100) >= 0 ? 'p' : 'n';
    return '<span class="bar" aria-hidden="true"><i class="' + cls + '" style="width:' + w.toFixed(1) + '%"></i></span>';
  }
  function banner(){
    if(!state.sample) return '';
    return '<div class="banner"><p>এটা নমুনা তথ্য, দেখার জন্য দেওয়া। নিজের মেসের হিসাব করতে নমুনা মুছে ফেলুন।</p><button class="btn" data-act="clearsample">নমুনা মুছে শুরু করুন</button></div>';
  }
  function empty(t, s){
    return '<div class="card empty"><span class="eic" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></span><h2>' + t + '</h2><p>' + s + '</p></div>';
  }
  function needMembers(){

  function render(){
    $('#month').textContent = state.month;
    document.querySelectorAll('.tab').forEach(function(b){
      if(b.dataset.tab === tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
    $('#main').innerHTML = (views[tab] || views.summary)();
    if(copyBox !== null && tab === 'summary'){
      var t = $('#copy-box'); if(t){ t.focus(); t.select(); }
    }
  }

  function summaryText(){
    var c = calc();
    var lines = ['মেস হিসাব – ' + state.month];
    if(c.totalMeals > 0) lines.push('মিল রেট: ' + tk2(c.rate) + ' (বাজার ' + tk(c.totalBazar) + ' ÷ ' + nfm.format(c.totalMeals) + ' মিল)');
    lines.push('মোট ভাড়া ও বিল: ' + tk(c.totalCost), '');
    c.rows.forEach(function(r){ lines.push(r.m.name + ': ' + pillText(r.net)); });
    return lines.join('\n');
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if(!el) return;
    var a = el.dataset.act, id = el.dataset.id, m;
    if(a === 'tab'){
      tab = el.dataset.tab; copyBox = null; confirmNew = false; render(); window.scrollTo(0,0);
    } else if(a === 'mealstep'){
      m = member(id); if(!m) return;
      m.meals = Math.max(0, m.meals + Number(el.dataset.d));
      var inp = document.getElementById('meal-' + id); if(inp) inp.value = m.meals;
      save();
    } else if(a === 'allplus'){
      state.members.forEach(function(x){ x.meals += 1; }); save(); render(); toast('সবার মিল ১ করে বাড়ল');
    } else if(a === 'delbazar'){
      state.bazar = state.bazar.filter(function(b){ return b.id !== id; }); save(); render();
    } else if(a === 'deladv'){
      state.advances = state.advances.filter(function(x){ return x.id !== id; }); save(); render();
    } else if(a === 'delmember'){
      if(state.bazar.some(function(b){ return b.who === id; }) || state.advances.some(function(x){ return x.from === id || x.to === id; })){ toast('আগে এই সদস্যের বাজার ও অগ্রিমের এন্ট্রি মুছুন'); return; }
      state.members = state.members.filter(function(x){ return x.id !== id; }); if(state.payer === id) state.payer = ''; save(); render();
    } else if(a === 'delfixed'){
      state.fixed = state.fixed.filter(function(f){ return f.id !== id; }); save(); render();
    } else if(a === 'copy'){
      var t = summaryText();
      var done = function(){ toast('হিসাব কপি হয়েছে'); };
      var fail = function(){ copyBox = t; render(); };
      try{
        if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fail); else fail();
      }catch(err){ fail(); }
    } else if(a === 'clearsample'){
      state = {sample:false, month:monthName(), members:[], bazar:[], advances:[], payer:'',
        fixed:['বিদ্যুৎ বিল','গ্যাস ও পানি','ইন্টারনেট','বুয়ার বেতন'].map(function(n){ return {id:uid(), name:n, amount:0}; })};
      tab = 'settings'; save(); render(); window.scrollTo(0,0); toast('নমুনা মুছে গেছে। সদস্য যোগ করুন।');
    } else if(a === 'newmonth'){
      if(!confirmNew){
        confirmNew = true; render();
        setTimeout(function(){ if(confirmNew){ confirmNew = false; if(tab === 'settings') render(); } }, 5000);
      } else {
        confirmNew = false;
        state.bazar = []; state.advances = []; state.sample = false; state.month = monthName();
        state.members.forEach(function(x){ x.meals = 0; });
        save(); render(); toast('নতুন মাস শুরু হয়েছে');
      }
    }
  });

  document.addEventListener('change', function(e){
    var el = e.target, f = el.dataset && el.dataset.field; if(!f) return;
    var id = el.dataset.id, m, fx;
    if(f === 'meal'){ m = member(id); if(m){ m.meals = Math.max(0, num(el.value)); el.value = m.meals; } }
    else if(f === 'mrent'){ m = member(id); if(m){ m.rent = Math.max(0, num(el.value)); el.value = m.rent; } }
    else if(f === 'payer'){ state.payer = el.value; }
    else if(f === 'mname'){ m = member(id); var nm = el.value.trim(); if(m){ if(nm) m.name = nm; else el.value = m.name; } }
    else if(f === 'fname'){ fx = fixedItem(id); var fn = el.value.trim(); if(fx){ if(fn) fx.name = fn; else el.value = fx.name; } }
    else if(f === 'famt'){ fx = fixedItem(id); if(fx){ fx.amount = Math.max(0, num(el.value)); el.value = fx.amount; } }
    else if(f === 'month'){ state.month = el.value.trim() || monthName(); $('#month').textContent = state.month; }
    save();
  });

  document.addEventListener('submit', function(e){
    var form = e.target.closest('[data-form]'); if(!form) return;
    e.preventDefault();
    var kind = form.dataset.form;
    if(kind === 'bazar'){
      var amt = num($('#bz-amt').value), who = $('#bz-who').value, date = $('#bz-date').value || todayStr();
      if(amt <= 0){ toast('টাকার অঙ্ক লিখুন'); $('#bz-amt').focus(); return; }
      lastWho = who;
      state.bazar.push({id:uid(), date:date, who:who, amount:amt, note:$('#bz-note').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean).join('\n')});
      save(); render(); toast('বাজার যোগ হয়েছে');
    } else if(kind === 'advance'){
      var aamt = num($('#ad-amt').value), afrom = $('#ad-from').value, ato = $('#ad-to').value;
      if(aamt <= 0){ toast('টাকার অঙ্ক লিখুন'); $('#ad-amt').focus(); return; }
      if(afrom === ato){ toast('যিনি দিচ্ছেন আর যাঁর কাছে দিচ্ছেন, দুজন আলাদা হতে হবে'); return; }
      lastWho = ato;
      state.advances.push({id:uid(), date:$('#ad-date').value || todayStr(), from:afrom, to:ato, amount:aamt});
      save(); render(); toast('অগ্রিম যোগ হয়েছে');
    } else if(kind === 'member'){
      var name = $('#new-member').value.trim();
      if(!name){ toast('সদস্যের নাম লিখুন'); return; }
      state.members.push({id:uid(), name:name, meals:0, rent:Math.max(0, num($('#new-rent').value))});
      save(); render(); toast(name + ' যোগ হয়েছে');
    } else if(kind === 'fixed'){
      var fname = $('#fx-name').value.trim(), famt = num($('#fx-amt').value);
      if(!fname){ toast('খরচের নাম লিখুন'); return; }
      state.fixed.push({id:uid(), name:fname, amount:Math.max(0, famt)});
      save(); render(); toast('বিল যোগ হয়েছে');
    }
  });

  render();
})();
</script>

</body>
</html>
